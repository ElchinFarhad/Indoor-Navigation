# Serves the built app from any host you control (see docs/DEPLOYMENT.md).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No visitor logs by default: the privacy notice says the app keeps nothing
    # about its users. Switch on only what your data protection officer agreed.
    access_log off;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # The camera and the motion sensors may be used by this site only.
    add_header Permissions-Policy "camera=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self), xr-spatial-tracking=(self), geolocation=(), microphone=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # Scripts and data from this host only; images also from https hosts so that
    # a venue may show product photos (tighten to your own image host).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # Fingerprinted build files and published venue versions never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~ ^/venues/.+/.+/.+/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # The list of venues says which version is current: always revalidate.
    location = /venues/index.json {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # Single-page app: unknown paths (/qrScanner/3, /shop, /privacy) open the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
